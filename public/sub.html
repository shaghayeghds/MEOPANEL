<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MEOPANEL · اشتراک من</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c5ce7'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<style>
:root{--bg:#0d0e1f;--sf:#161838cc;--sf2:#1f2249;--ln:#2e3263;--tx:#efeeff;--mu:#9396c0;--ac:#8f8fff;--glow:#6a5cff;--ok:#5ee6b4;--wn:#ffbd73;--er:#ff6f91;--r:22px}
@media(prefers-color-scheme:light){:root{--bg:#f1f1fb;--sf:#ffffffdd;--sf2:#eceafc;--ln:#dad8f2;--tx:#1b1a38;--mu:#6b6e97;--ac:#5a5af2;--glow:#8b7dff;--ok:#0e9c6d;--wn:#bd7513;--er:#d3305a}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);min-height:100vh;line-height:1.75;
 background:radial-gradient(900px 520px at 90% -8%,color-mix(in srgb,var(--glow) 32%,transparent),transparent),radial-gradient(760px 520px at -8% 105%,color-mix(in srgb,var(--ok) 15%,transparent),transparent),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:10px;padding:6px 4px 20px}
.emj{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--ac),var(--glow));overflow:hidden}.emj img{width:100%;height:100%;object-fit:cover}.top b{font-weight:800;letter-spacing:1.5px;font-size:17px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 26px;color:#fff;background:linear-gradient(130deg,#4f3fff,#8a5cff 55%,#25bfae);box-shadow:0 30px 70px -28px var(--glow)}
.hero::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#fff2;inset:auto auto -150px -90px}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff1a;top:-70px;right:-40px}
.hero-in{position:relative;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.who{flex:1;min-width:200px}
.who small{opacity:.8;font-size:13px}
.who h1{font-size:30px;font-weight:800;line-height:1.3;word-break:break-word;margin:2px 0 10px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:99px;background:#0003;backdrop-filter:blur(6px);font-size:13px;font-weight:500}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#5ee6b4);box-shadow:0 0 10px var(--c,#5ee6b4)}
.badge.bad{--c:#ff8fa8}
.ring{--p:0;position:relative;width:148px;height:148px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff33 0)}
.ring i{width:116px;height:116px;border-radius:50%;background:#3b2fb8;display:grid;place-items:center;text-align:center;font-style:normal;line-height:1.35}
.ring b{font-size:27px;font-weight:800;display:block}.ring span{font-size:12px;opacity:.8}
.stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.stats div{background:#0003;border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.stats small{display:block;opacity:.75;font-size:12px}.stats b{font-size:15px;font-weight:700}
.alert{margin-top:14px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--er) 15%,transparent);border:1px solid color-mix(in srgb,var(--er) 50%,transparent);color:var(--er);font-size:14px}
h2{font-size:17px;font-weight:800;margin:30px 4px 4px}
.hint{color:var(--mu);font-size:13px;margin:0 4px 14px}
.card{background:var(--sf);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.app{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:18px;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s}
.app:hover{border-color:var(--ac)}.app:active{transform:scale(.98)}
.app .lg{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g);flex:none;font-size:17px}
.app b{display:block;font-size:14px}.app small{color:var(--mu);font-size:12px}
.lk{display:flex;gap:8px;align-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:14px;padding:8px 10px}
.lk .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--sf2);padding:7px 14px;border-radius:11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--glow));border:0;color:#fff;font-weight:700}
.cfg{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:18px;margin-bottom:10px}
.cfg .n{flex:1;min-width:0}.cfg b{display:block;font-size:14px}.cfg small{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:0 9px;border-radius:99px;background:var(--sf2);font-size:11px;color:var(--ac);margin-inline-start:6px;vertical-align:middle}
.row{display:flex;gap:6px}
.qr{display:flex;justify-content:center;background:#fff;border-radius:16px;padding:14px;margin-top:12px}
dialog{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:24px;padding:24px;width:min(360px,92vw);margin:auto;text-align:center}
dialog::backdrop{background:#05061099;backdrop-filter:blur(5px)}
footer{text-align:center;color:var(--mu);font-size:12px;margin-top:34px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--ac),var(--glow));color:#fff;padding:10px 22px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}

@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes hue{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.2)}}
@keyframes rise-up{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.2}88%{opacity:.2}100%{transform:translateY(-115vh) rotate(28deg);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #5ee6b4aa}70%,100%{box-shadow:0 0 0 10px transparent}}
.rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.hero{background-size:220% 220%;animation:rise .7s cubic-bezier(.2,.8,.2,1) both,hue 12s ease infinite}
.hero .deco{position:absolute;left:18px;bottom:2px;font-size:104px;line-height:1;opacity:.26;animation:float 6s ease-in-out infinite;pointer-events:none}
.ring{transition:--p 1.5s cubic-bezier(.2,.8,.2,1) .25s}
.badge:not(.bad)::before{animation:pulse 2s infinite}
.top .emj{animation:float 5s ease-in-out infinite}
.stats div{transition:transform .2s,background .2s}.stats div:hover{transform:translateY(-3px);background:#0004}
.app{position:relative;overflow:hidden}
.app::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--ac) 22%,transparent) 50%,transparent 70%);transform:translateX(130%);transition:transform .7s}
.app:hover::after{transform:translateX(-130%)}.app:hover{transform:translateY(-3px)}
.app .lg{font-size:21px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.app:hover .lg{transform:scale(1.15) rotate(-6deg)}
.cfg{transition:transform .2s,border-color .2s}.cfg:hover{transform:translateX(-4px);border-color:var(--ac)}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 16s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:380px;height:380px;background:var(--glow);opacity:.25;top:-90px;right:-70px}
.bgfx i:nth-child(2){width:320px;height:320px;background:var(--ok);opacity:.12;bottom:-80px;left:-60px;animation-delay:-7s}
.bgfx span{position:absolute;bottom:-70px;left:var(--x);font-size:var(--s,30px);opacity:0;animation:rise-up var(--d,18s) linear infinite;animation-delay:var(--w,0s)}
.wrap{position:relative;z-index:1}
dialog[open]{animation:rise .3s cubic-bezier(.2,1.2,.3,1) both}
@media(prefers-reduced-motion:reduce){.rise,.hero{animation:none!important}.ring{transition:none}}

@keyframes spin{to{transform:rotate(360deg)}}
.emj{font-size:0;box-shadow:0 8px 20px -8px var(--glow),inset 0 1px 0 #fff4}.emj svg{width:22px;height:22px}
.top .emj{animation:none}
.hero .deco{font-size:0;left:4px;bottom:-40px;opacity:.2;animation:spin 60s linear infinite}
.hero .deco svg{width:200px;height:200px;fill:none;stroke:#fff;stroke-width:1.1}
.app .lg{font-size:18px;font-weight:800}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.ring{margin:0 auto}.who{text-align:center}.who h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i></div>
<div class="wrap" id="app"></div>
<dialog id="qd"><h3 id="qt" style="margin-bottom:4px"></h3><div id="qb"></div><button class="btn" style="margin-top:16px;width:100%" onclick="qd.close()">بستن</button></dialog>
<div id="toast"></div>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>(+n).toLocaleString('fa-IR',{maximumFractionDigits:1});
const fmt=b=>{b=+b||0;const u=['بایت','کیلوبایت','مگابایت','گیگابایت','ترابایت'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return fa(+b.toFixed(i>1?2:0))+' '+u[i]};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1700)};
const copy=t=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}).finally(()=>toast('کپی شد'))};
const LOGO_IMAGE='';
const GLYPH='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.2c0 4.4-3 8-7 9.3-4-1.3-7-4.9-7-9.3V6z"/><path d="M8.7 13.4V9.8l3.3 2.8 3.3-2.8v3.6"/></svg>';
const DECO='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50"/><ellipse cx="60" cy="60" rx="22" ry="50"/><path d="M10 60h100M18 36h84M18 84h84"/><path d="M92 30L60 60 28 78"/><circle cx="92" cy="30" r="4.5" fill="#fff"/><circle cx="28" cy="78" r="4.5" fill="#fff"/><circle cx="60" cy="60" r="4.5" fill="#fff"/></svg>';
const CAT=`<span class="emj">${LOGO_IMAGE?`<img src="${LOGO_IMAGE}" alt="">`:GLYPH}</span>`;
const S={active:['فعال',0],disabled:['غیرفعال',1],expired:['منقضی شده',1],limit:['حجم تمام شده',1]}[D.status];
const unl=!D.total,pc=unl?0:Math.min(100,D.used/D.total*100),left=unl?null:Math.max(0,D.total-D.used);
const days=D.expireAt?Math.ceil((D.expireAt-Date.now())/864e5):null;
const proto=l=>l.split('://')[0].toUpperCase();
const sub=D.sub,enc=encodeURIComponent;
const APPS=[['v2rayNG','اندروید','V','#3b82f6,#6366f1',`v2rayng://install-sub?url=${enc(sub)}&name=MEOPANEL`],
['Hiddify','اندروید · iOS · ویندوز','H','#8b5cf6,#d946ef',`hiddify://import/${sub}#MEOPANEL`],
['Streisand','iOS','S','#06b6d4,#3b82f6',`streisand://import/${sub}`],
['Shadowrocket','iOS','R','#f59e0b,#ef4444',`sub://${btoa(sub)}`],
['sing-box','همه‌ی سیستم‌ها','B','#10b981,#14b8a6',`sing-box://import-remote-profile?url=${enc(sub)}#MEOPANEL`]];
$('#app').innerHTML=`
<div class="top">${CAT}<b>MEOPANEL</b></div>
<section class="hero"><span class="deco">${DECO}</span><div class="hero-in">
 <div class="who"><small>اشتراک اختصاصی</small><h1>${esc(D.name)}</h1><span class="badge ${S[1]?'bad':''}">${S[0]}</span></div>
 <div class="ring" id="rg" style="--p:0" data-p="${pc}"><i><div>${unl?'<b>∞</b><span>حجم نامحدود</span>':`<b data-cu="pct" data-v="${pc}">${fa(Math.round(pc))}٪</b><span>مصرف‌شده</span>`}</div></i></div>
</div>
<div class="stats">
 <div><small>مصرف</small><b data-cu="bytes" data-v="${D.used}">${fmt(D.used)}</b></div>
 <div><small>باقی‌مانده</small><b ${unl?'':`data-cu="bytes" data-v="${left}"`}>${unl?'نامحدود':fmt(left)}</b></div>
 <div><small>مدت باقی‌مانده</small><b ${days>0?`data-cu="days" data-v="${days}"`:''}>${days===null?'نامحدود':days>0?fa(days)+' روز':'تمام شده'}</b></div>
 <div><small>تاریخ انقضا</small><b>${D.expireAt?new Date(D.expireAt).toLocaleDateString('fa-IR'):'—'}</b></div>
</div></section>
${S[1]?`<div class="alert">${{disabled:'این اشتراک توسط مدیر غیرفعال شده است.',expired:'مدت این اشتراک تمام شده است؛ برای تمدید با مدیر تماس بگیرید.',limit:'حجم این اشتراک تمام شده است؛ برای افزایش حجم با مدیر تماس بگیرید.'}[D.status]}</div>`:''}
<h2>اتصال سریع</h2><p class="hint">برنامه‌ی خود را انتخاب کنید تا اشتراک خودکار اضافه شود.</p>
<div class="apps">${APPS.map(a=>`<a class="app" href="${esc(a[4])}"><span class="lg" style="--g:linear-gradient(135deg,${a[3].split(',').join(',')})">${a[2]}</span><span><b>${a[0]}</b><small>${a[1]}</small></span></a>`).join('')}</div>
<h2>لینک اشتراک</h2><p class="hint">اگر برنامه‌تان در بالا نبود، این لینک را در بخش افزودن اشتراک (Subscription) آن بچسبانید.</p>
<div class="card"><div class="lk"><span class="mono">${esc(sub)}</span><button class="btn pri" onclick="copy(D.sub)">کپی</button><button class="btn" onclick="showQR(D.sub,'QR لینک اشتراک')">QR</button></div></div>
${D.links.length?`<h2>کانفیگ‌های تکی</h2><p class="hint">برای وارد کردن دستی یک کانفیگ مشخص.</p>${D.links.map((l,i)=>`<div class="cfg"><div class="n"><b>${esc(l.name)}<span class="tag">${proto(l.link)}</span></b><small>${l.core==='xray'?'Xray-core':'sing-box'} · WebSocket · TLS</small></div><div class="row"><button class="btn pri" onclick="copy(D.links[${i}].link)">کپی</button><button class="btn" onclick="showQR(D.links[${i}].link,D.links[${i}].name)">QR</button></div></div>`).join('')}`:''}
<footer>ارائه‌شده با MEOPANEL</footer>`;
(function(){let i=0;document.querySelectorAll('.hero,.alert,#app>h2,#app>.hint,.apps>*,#app>.card,.cfg,footer,.top').forEach(e=>{if(e.classList.contains('hero')){e.style.setProperty('--i',0);return}e.style.setProperty('--i',i++*.55+1);e.classList.add('rise')});
 const cu=(el,to,f,dur=1300)=>{const t0=performance.now()+250,st=t=>{const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)};
 document.querySelectorAll('[data-cu]').forEach(e=>{const v=+e.dataset.v,k=e.dataset.cu;cu(e,v,k==='bytes'?fmt:k==='days'?x=>fa(Math.ceil(x))+' روز':x=>fa(Math.round(x))+'٪')});
 const r=document.getElementById('rg');if(r)requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty('--p',r.dataset.p)))})();
function showQR(t,title){$('#qt').textContent=title;try{if(!window.qrcode)throw 0;const q=qrcode(0,'L');q.addData(t);q.make();$('#qb').innerHTML='<div class="qr">'+q.createSvgTag({cellSize:5,margin:0,scalable:true})+'</div>'}catch{$('#qb').innerHTML='<p class="hint" style="margin-top:12px">ساخت QR ممکن نشد؛ از دکمه‌ی کپی استفاده کنید.</p>'}$('#qd').showModal()}
const qd=$('#qd');
</script>
</body>
</html>
