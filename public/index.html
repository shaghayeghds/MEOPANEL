<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEOPANEL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c5ce7'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<style>
:root{--bg:#0d0e1f;--sf:#151735cc;--sf2:#1e2147;--ln:#2d3160;--tx:#efeeff;--mu:#9093bd;--ac:#8f8fff;--ac2:#c0c0ff;--glow:#6a5cff;--ok:#5ee6b4;--wn:#ffbd73;--er:#ff6f91;--r:18px;--sh:0 10px 40px -12px #0009}
@media(prefers-color-scheme:light){:root{--bg:#f1f1fb;--sf:#ffffffd9;--sf2:#eceafc;--ln:#dad8f2;--tx:#1b1a38;--mu:#6b6e97;--ac:#5a5af2;--ac2:#3d3dc9;--glow:#8b7dff;--ok:#0e9c6d;--wn:#bd7513;--er:#d3305a;--sh:0 10px 30px -14px #4a46a055}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);min-height:100vh;display:flex;line-height:1.75;
 background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--glow) 30%,transparent),transparent),radial-gradient(760px 520px at -8% 108%,color-mix(in srgb,var(--ok) 14%,transparent),transparent),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:250px;flex:none;background:var(--sf);backdrop-filter:blur(18px);border-inline-end:1px solid var(--ln);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.logo b{font-size:20px;font-weight:800;letter-spacing:1px;display:block;line-height:1.2}
.logo small{color:var(--mu);font-size:11.5px}
nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;border-radius:12px;color:var(--mu);cursor:pointer;text-align:start;transition:background .15s,color .15s}
nav button:hover{background:var(--sf2);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 22%,transparent),transparent);color:var(--tx);box-shadow:inset -3px 0 0 var(--ac)}
nav button.on svg{color:var(--ac)}
.sp{flex:1}
main{flex:1;min-width:0;padding:34px 38px 70px;max-width:1220px}
h1{font-size:26px;font-weight:800}
.sub{color:var(--mu);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:18px}
.panel,.stat,.card,.box{background:var(--sf);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
.stat{padding:20px;display:flex;gap:14px;align-items:center}
.stat .bub{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.stat .bub svg{width:23px;height:23px}
.stat .v{font-size:28px;font-weight:800;line-height:1.2}.stat .l{color:var(--mu);font-size:13px}
.hero{grid-column:span 2;padding:24px 26px;border:0;position:relative;overflow:hidden;color:#fff;background:linear-gradient(125deg,#5b4bff,#8a5cff 55%,#2fc4b2)}
.hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:240px;height:240px;border-radius:50%;background:#fff2;filter:blur(2px)}
.hero .l,.hero .mu{color:#fff}
.hero .l{opacity:.85;font-size:14px}.hero .v{font-size:42px;font-weight:800;line-height:1.3}.hero .mu{opacity:.8;font-size:13px}
.donut{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sf2) 0);display:grid;place-items:center;flex:none}
.donut i{width:68px;height:68px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.box{padding:6px 4px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mu);font-weight:500;text-align:start;padding:13px 16px;font-size:13px}
td{padding:14px 16px;border-top:1px solid var(--ln);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.btn{border:1px solid var(--ln);background:var(--sf2);padding:8px 16px;border-radius:12px;cursor:pointer;font-size:13px;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--glow));border:0;color:#fff;font-weight:700;box-shadow:0 8px 22px -8px var(--glow)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dn{color:var(--er)}.btn.sm{padding:4px 11px;font-size:12px;border-radius:9px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:99px;font-size:12px;background:var(--sf2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mu)}
.pill.ok{color:var(--ok)}.pill.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.er{color:var(--er)}.pill.er::before{background:var(--er)}
.pill.wn{color:var(--wn)}.pill.wn::before{background:var(--wn)}
.meter{height:7px;border-radius:9px;background:var(--sf2);min-width:120px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--glow));border-radius:9px}
.meter i.hi{background:linear-gradient(90deg,var(--wn),var(--er))}
.mu{color:var(--mu);font-size:12px}
.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:plaintext;font-size:12px}
dialog{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:22px;padding:26px;width:min(540px,94vw);margin:auto;box-shadow:0 30px 80px -20px #000b}
dialog::backdrop{background:#05061088;backdrop-filter:blur(5px)}
dialog h2{font-size:19px;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mu);margin:13px 0 5px}
input,select{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px 13px}
input:focus,select:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.lk{display:flex;gap:8px;align-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-top:8px}
.lk .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr{display:flex;justify-content:center;background:#fff;border-radius:14px;padding:14px;margin:14px auto 0;width:fit-content}
.log{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px;max-height:230px;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap;font-size:12px;color:var(--mu)}
.card{padding:22px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.core{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.core+.core{border-top:1px solid var(--ln)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--ac),var(--glow));color:#fff;padding:11px 22px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;box-shadow:0 12px 30px -10px var(--glow)}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:38px;text-align:center;color:var(--mu)}
.warn{background:color-mix(in srgb,var(--wn) 14%,transparent);border:1px solid color-mix(in srgb,var(--wn) 45%,transparent);color:var(--wn);padding:10px 14px;border-radius:12px;font-size:13px;margin-top:12px}
/* ورود */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(800px 520px at 82% -6%,color-mix(in srgb,var(--glow) 42%,transparent),transparent),radial-gradient(700px 520px at 4% 106%,color-mix(in srgb,var(--ok) 18%,transparent),transparent),var(--bg)}
.lg-form{width:min(400px,100%);background:var(--sf);backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:28px;padding:36px 30px 30px;box-shadow:0 30px 80px -26px #000c;text-align:center}
.lg-emoji{font-size:78px;line-height:1.1;margin-bottom:8px;filter:drop-shadow(0 10px 26px var(--glow))}
.lg-emoji img{width:104px;height:104px;object-fit:contain;border-radius:26px}
.lg-form h2{font-size:26px;font-weight:800;letter-spacing:2px}
.lg-form .sub{margin:4px 0 26px}
.fld{position:relative;margin-bottom:14px}
.fld input{padding:23px 16px 8px;border-radius:16px;font-size:15px;text-align:right;direction:ltr}
.fld label{position:absolute;right:16px;top:14px;margin:0;font-size:14px;color:var(--mu);pointer-events:none;transition:top .15s,font-size .15s,color .15s}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:4px;font-size:11px;color:var(--ac)}
.fld .tg{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mu);cursor:pointer;padding:8px;border-radius:10px;display:grid}
.fld .tg:hover{color:var(--tx);background:var(--sf2)}
.fld.pw input{padding-left:50px}
.go{width:100%;margin-top:8px;padding:14px;font-size:15px;border-radius:16px}
.go[disabled]{opacity:.7;cursor:progress}
.caps{display:none;font-size:12.5px;color:var(--wn);margin:-4px 4px 8px;text-align:right}
.caps.on{display:block}
#login .warn{margin-top:20px;text-align:right}
#le{color:var(--er);margin-top:14px;font-size:13px;min-height:20px}
.derr{color:var(--er);font-size:13px;min-height:20px;margin-top:10px}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.emj{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,var(--ac),var(--glow));box-shadow:0 8px 20px -8px var(--glow);flex:none;overflow:hidden}
.emj img{width:100%;height:100%;object-fit:cover}

/* ===== انیمیشن‌ها و ایموجی ===== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
@keyframes hue{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{to{transform:translate(50px,-40px) scale(1.2)}}
@keyframes rise-up{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.2}88%{opacity:.2}100%{transform:translateY(-115vh) rotate(28deg);opacity:0}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*65ms)}
tr.rise{animation-duration:.45s}
nav button .ne{font-size:19px;width:24px;text-align:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1);flex:none}
nav button:hover .ne,nav button.on .ne{transform:scale(1.25) rotate(-8deg)}
nav button.on{animation:pop .35s both}
.btn.pri{position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(130%);transition:transform .7s}
.btn.pri:hover::after{transform:translateX(-130%)}
.pill.ok::before{animation:pulse 2s infinite}
.meter i{transform-origin:right;animation:grow 1s cubic-bezier(.2,.8,.2,1) both .15s}
.donut{transition:--p 1.4s cubic-bezier(.2,.8,.2,1)}
.hero{background-size:220% 220%;animation:hue 12s ease infinite}
.hero .deco{position:absolute;left:20px;bottom:4px;font-size:96px;line-height:1;opacity:.28;animation:float 6s ease-in-out infinite;pointer-events:none}
.stat .bub{font-size:24px;animation:float 5s ease-in-out infinite}
.emj{font-size:23px}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.2,.3,1) both}
dialog[open]::backdrop{animation:rise .25s both}
.row .btn{transition:transform .15s,border-color .15s,background .15s}
.row .btn:hover{transform:translateY(-2px)}
.box tr{transition:background .2s}
.empty .big{font-size:54px;display:block;animation:float 4s ease-in-out infinite}
/* ورود: پس‌زمینه‌ی زنده */
.aur{position:absolute;border-radius:50%;filter:blur(72px);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.a1{width:440px;height:440px;background:var(--glow);opacity:.42;top:-110px;right:-90px}
.a2{width:360px;height:360px;background:var(--ok);opacity:.2;bottom:-100px;left:-70px;animation-delay:-6s}
.fl-emo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fl-emo span{position:absolute;bottom:-70px;left:var(--x);font-size:var(--s,30px);opacity:0;animation:rise-up var(--d,16s) linear infinite;animation-delay:var(--w,0s)}
.lg-form{position:relative;z-index:1;animation:pop .6s cubic-bezier(.2,1.1,.3,1) both}
.lg-emoji{animation:float 4.5s ease-in-out infinite}
.lg-form .fld,.lg-form .go,.lg-form h2,.lg-form .sub{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.lg-form h2{animation-delay:.15s}.lg-form .sub{animation-delay:.22s}.lg-form .fld:nth-of-type(1){animation-delay:.3s}.lg-form .fld:nth-of-type(2){animation-delay:.38s}.lg-form .go{animation-delay:.46s}

/* ===== آیکون‌های حرفه‌ای ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.28);opacity:0}}
nav button .ne{display:grid;place-items:center;font-size:0}
nav button:hover .ne,nav button.on .ne{transform:scale(1.14)}
.hd{display:flex;align-items:center;gap:15px}
.pt{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--glow));box-shadow:0 12px 26px -10px var(--glow),inset 0 1px 0 #fff4;flex:none}
.pt svg{width:23px;height:23px;stroke-width:1.9}
.emj{font-size:0;box-shadow:0 8px 20px -8px var(--glow),inset 0 1px 0 #fff4}
.emj svg{width:23px;height:23px}
.lg-emoji{font-size:0;display:grid;place-items:center;margin-bottom:18px;filter:none}
.lgmark{margin-top:8px;position:relative;width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#8f8fff,#5a3df0);box-shadow:0 20px 44px -14px var(--glow),inset 0 1px 0 #fff5}
.lgmark svg{width:50px;height:50px}.lgmark img{width:100%;height:100%;object-fit:cover;border-radius:28px}
.lgmark::after{content:"";position:absolute;inset:-6px;border-radius:34px;border:2px solid var(--ac);animation:ring 3s ease-out infinite}
.hero .deco{font-size:0;left:6px;bottom:-34px;opacity:.2;animation:spin 60s linear infinite}
.hero .deco svg{width:190px;height:190px;fill:none;stroke:#fff;stroke-width:1.1}
.stat .bub{font-size:0;animation:none}
.empty .big{font-size:0}.empty .big svg{width:56px;height:56px;opacity:.45;stroke-width:1.4;animation:float 4s ease-in-out infinite}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;border-inline-end:0;border-bottom:1px solid var(--ln)}.logo,.sp{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap}main{padding:22px 14px 60px}.hero{grid-column:auto}.two-col{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="aur a1"></div><div class="aur a2"></div>
  <form class="lg-form" onsubmit="return doLogin(event)">
    <div class="lg-emoji" id="lgi"></div>
    <h2>MEOPANEL</h2><p class="sub">برای ورود، اطلاعات مدیر را وارد کنید.</p>
    <div class="fld"><input id="lu" placeholder=" " autocomplete="username" dir="ltr" autofocus><label for="lu">نام کاربری</label></div>
    <div class="fld pw"><input id="lp" type="password" placeholder=" " autocomplete="current-password" dir="ltr" onkeyup="caps(event)" onkeydown="caps(event)"><label for="lp">رمز عبور</label><button type="button" class="tg" id="tg" onclick="togglePw()" aria-label="نمایش رمز"></button></div>
    <div class="caps" id="caps">Caps Lock روشن است.</div>
    <button class="btn pri go" id="lb">ورود به پنل</button>
    <p id="le"></p>
    <p id="hint" class="warn" hidden>اولین ورود: نام کاربری <b>admin</b> و رمز <b>admin</b>؛ بعد از ورود باید رمز را عوض کنید.</p>
  </form>
</div>

<aside>
  <div class="logo"><span class="mk-slot"></span><div><b>MEOPANEL</b><small>مدیریت سرویس‌ها</small></div></div>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <nav><button onclick="logout()"><span id="lo"></span>خروج</button></nav>
</aside>
<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="force"></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.3 3.5 5.2"/>',
inb:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',out:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
cores:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
out2:'<path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 8l-4 4 4 4M6 12h10"/>',traffic:'<path d="M12 3v14M6 11l6 6 6-6M5 21h14"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24">${P[k]}</svg>`;
// شخصی‌سازی لوگو: برای عکس، آدرس آن را در LOGO_IMAGE بنویسید (مثلاً یک لینک https)
const LOGO_IMAGE='';
const GLYPH='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.2c0 4.4-3 8-7 9.3-4-1.3-7-4.9-7-9.3V6z"/><path d="M8.7 13.4V9.8l3.3 2.8 3.3-2.8v3.6"/></svg>';
const DECO='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50"/><ellipse cx="60" cy="60" rx="22" ry="50"/><path d="M10 60h100M18 36h84M18 84h84"/><path d="M92 30L60 60 28 78"/><circle cx="92" cy="30" r="4.5" fill="#fff"/><circle cx="28" cy="78" r="4.5" fill="#fff"/><circle cx="60" cy="60" r="4.5" fill="#fff"/></svg>';
const logo=LOGO_IMAGE?`<img src="${LOGO_IMAGE}" alt="">`:GLYPH;
$('#lgi').innerHTML=`<span class="lgmark">${logo}</span>`;
document.querySelectorAll('.mk-slot').forEach(e=>e.outerHTML=`<span class="emj">${logo}</span>`);$('#lo').outerHTML='<span class="ne">'+ico('out2')+'</span>';
const EYE='<svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYE0='<svg class="ic" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.9M6.5 7.6C3.9 9.3 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
$('#tg').innerHTML=EYE;
function togglePw(){const i=$('#lp'),s=i.type==='password';i.type=s?'text':'password';$('#tg').innerHTML=s?EYE0:EYE}
function caps(e){$('#caps').classList.toggle('on',!!(e.getModifierState&&e.getModifierState('CapsLock')))}
const pages={dash:'داشبورد',users:'کاربران',inb:'اینباندها',set:'تنظیمات'};
let cur='dash',timer;
const fmt=b=>{b=+b||0;const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return '<bdi dir="ltr">'+b.toFixed(i?2:0)+' '+u[i]+'</bdi>'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1900)};
function showLogin(){$('#login').hidden=false;fetch('/api/hint').then(r=>r.json()).then(j=>$('#hint').hidden=!j.first).catch(()=>{})}
async function api(m,u,d){const r=await fetch('/api'+u,{method:m,headers:{'content-type':'application/json'},body:d?JSON.stringify(d):undefined});
  if(r.status===401&&u!=='/login'){showLogin();throw 0}
  const j=await r.json().catch(()=>({}));
  if(j.mustChange&&r.status===403){showForce();throw 0}
  if(!r.ok){const m=j.error||'خطا';toast(m);document.querySelectorAll('dialog[open] .derr').forEach(e=>e.textContent=m);throw j}return j}
async function doLogin(e){e.preventDefault();$('#le').textContent='';const b=$('#lb');b.disabled=true;b.textContent='در حال ورود…';
  try{await api('POST','/login',{username:$('#lu').value,password:$('#lp').value});$('#login').hidden=true;$('#lp').value='';boot()}
  catch(x){$('#le').textContent=x&&x.error||'ورود انجام نشد';const f=$('.lg-form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
  b.disabled=false;b.textContent='ورود به پنل';return false}
async function logout(){await api('POST','/logout');location.reload()}
async function boot(){try{const o=await api('GET','/overview');if(o.mustChange)showForce();else go(cur)}catch{}}
function stagger(){let i=0;document.querySelectorAll('#main .bar,#main .grid>*,#main .two-col>*,#main>.card,#main .box,#main .warn').forEach(e=>{e.style.setProperty('--i',i++);e.classList.add('rise')});
 document.querySelectorAll('#main tr').forEach((e,k)=>{e.style.setProperty('--i',Math.min(k,12)+3);e.classList.add('rise')})}
function go(p){cur=p;clearInterval(timer);if(p!=='dash')dash.seen=0;
  $('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${k===p?'on':''}" onclick="go('${k}')"><span class="ne">${ico(k)}</span>${v}</button>`).join('');
  const f={dash,users,inb,set}[p];if(!f)return;f().then(stagger).catch(()=>{});if(p==='dash')timer=setInterval(()=>f().catch(()=>{}),6000)}
const HI={'داشبورد':'dash','کاربران':'users','اینباندها':'inb','تنظیمات':'set'};
const head=(t,s,a='')=>`<div class="bar"><div class="hd">${HI[t]?`<span class="pt">${ico(HI[t])}</span>`:''}<div><h1>${t}</h1><div class="sub">${s}</div></div></div>${a}</div>`;
const st=s=>({running:['ok','در حال اجرا'],stopped:['wn','متوقف'],starting:['wn','در حال راه‌اندازی'],missing:['er','نصب نشده'],crashed:['er','خطا؛ تلاش مجدد'],error:['er','خطا']}[s]||['wn',s]);
const pill=s=>{const [c,t]=st(s);return`<span class="pill ${c}">${t}</span>`};
const cn=k=>k==='xray'?'Xray-core':'sing-box';

function countUp(el,to,f,dur=1200){const t0=performance.now(),st=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.innerHTML=f(to*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
async function dash(){const o=await api('GET','/overview'),pc=o.users?Math.round(o.active/o.users*100):0,first=!dash.seen;
 $('#main').innerHTML=head('داشبورد','نمای کلی سرویس شما')+`<div class="grid">
 <div class="stat hero"><span class="deco">${DECO}</span><div style="position:relative"><div class="l">ترافیک مصرفی کاربران</div><div class="v" data-cu="bytes" data-v="${o.used}">${fmt(o.used)}</div><div class="mu">کل عبور از اینباندها: ${fmt(o.inboundBytes)}</div></div></div>
 <div class="stat"><div class="donut" id="dn" style="--p:${first?0:pc}"><i>${pc}٪</i></div><div><div class="v"><span data-cu="int" data-v="${o.active}">${o.active}</span><span class="mu"> از ${o.users}</span></div><div class="l">کاربر فعال</div></div></div>
 <div class="stat"><div class="bub">${ico('inb')}</div><div><div class="v" data-cu="int" data-v="${o.inbounds}">${o.inbounds}</div><div class="l">اینباند</div></div></div></div>
 <div class="card"><h3>آدرس پنل</h3><div class="lk"><span class="mono">https://${esc(o.host)}</span><button class="btn sm" data-t="https://${esc(o.host)}" onclick="cp(this)">کپی</button></div></div>`;
 if(first){dash.seen=1;requestAnimationFrame(()=>requestAnimationFrame(()=>{const d=$('#dn');if(d)d.style.setProperty('--p',pc)}));
  document.querySelectorAll('[data-cu]').forEach(e=>{const v=+e.dataset.v;if(e.dataset.cu==='bytes')countUp(e,v,x=>fmt(x));else countUp(e,v,x=>Math.round(x))})}}

async function users(){const us=await api('GET','/users');
 $('#main').innerHTML=head('کاربران','ساخت و مدیریت کانفیگ‌ها','<button class="btn pri" onclick="userForm()">+ کاربر جدید</button>')+
 `<div class="box">${us.length?`<table><tr><th>نام</th><th>وضعیت</th><th>مصرف</th><th>انقضا</th><th></th></tr>`+us.map(u=>{
  const exp=u.expireAt&&u.expireAt<Date.now(),over=u.limitGB&&u.used>=u.limitGB*1e9,pc=u.limitGB?Math.min(100,u.used/(u.limitGB*1e7)):0;
  const s=!u.enabled?['wn','غیرفعال']:exp?['er','منقضی']:over?['er','حجم تمام شد']:['ok','فعال'];
  return`<tr><td><b>${esc(u.name)}</b><div class="mu mono">${u.id}</div></td><td><span class="pill ${s[0]}">${s[1]}</span></td>
  <td><div class="meter"><i class="${pc>85?'hi':''}" style="width:${u.limitGB?pc:4}%"></i></div><div class="mu">${fmt(u.used)} / ${u.limitGB?u.limitGB+' GB':'نامحدود'}</div></td>
  <td class="mu">${u.expireAt?new Date(u.expireAt).toLocaleDateString('fa-IR'):'نامحدود'}</td>
  <td><div class="row"><button class="btn sm pri" onclick="showLinks('${u.id}')">کانفیگ</button><button class="btn sm" onclick="userForm('${u.id}')">ویرایش</button>
  <button class="btn sm" onclick="tog('${u.id}',${!u.enabled})">${u.enabled?'غیرفعال':'فعال'}</button><button class="btn sm" onclick="rst('${u.id}')">ریست حجم</button><button class="btn sm dn" onclick="delU('${u.id}')">حذف</button></div></td></tr>`}).join('')+'</table>':'<div class="empty"><span class="big">'+ico('users')+'</span>هنوز کاربری ندارید. اولین کاربر را بسازید.</div>'}</div>`}
async function userForm(id){const u=id?(await api('GET','/users')).find(x=>x.id===id):{};
 dlg(`<h2>${id?'ویرایش کاربر':'کاربر جدید'}</h2><label>نام</label><input id="f1" value="${esc(u.name||'')}">
 <div class="two"><div><label>حجم (گیگابایت، ۰ = نامحدود)</label><input id="f2" type="number" min="0" value="${u.limitGB||0}"></div>
 <div><label>مدت (روز، ۰ = نامحدود)</label><input id="f3" type="number" min="0" value="${id?0:30}"></div></div>${id?'<p class="mu" style="margin-top:8px">برای تغییر انقضا، تعداد روز جدید (از امروز) را بنویسید؛ ۰ یعنی نامحدود.</p>':''}
 <div class="foot"><button class="btn" onclick="dlg()">انصراف</button><button class="btn pri" onclick="saveU('${id||''}')">ذخیره</button></div>`)}
async function saveU(id){const d={name:$('#f1').value||'user',limitGB:+$('#f2').value,days:+$('#f3').value};
 await api(id?'PUT':'POST','/users'+(id?'/'+id:''),d);dlg();toast('ذخیره شد');users()}
const tog=async(id,e)=>{await api('PUT','/users/'+id,{enabled:e});users()};
const rst=async id=>{await api('POST','/users/'+id+'/reset',{});toast('مصرف صفر شد');users()};
const delU=async id=>{if(confirm('این کاربر حذف شود؟')){await api('DELETE','/users/'+id);users()}};
async function showLinks(id){const d=await api('GET','/users/'+id+'/links');
 dlg(`<h2>کانفیگ‌های کاربر</h2><label>لینک اشتراک (Subscription)</label>${lk(d.sub)}<div id="qrbox"></div>
 <label>کانفیگ‌های تکی</label>${d.links.map(l=>`<div class="mu" style="margin-top:8px">${esc(l.name)}</div>${lk(l.link)}`).join('')||'<div class="empty">اینباند فعالی وجود ندارد</div>'}
 <div class="foot"><button class="btn" onclick="dlg()">بستن</button></div>`);qr(d.sub)}
const lk=t=>`<div class="lk"><span class="mono">${esc(t)}</span><button class="btn sm" onclick="cp(this)" data-t="${esc(t)}">کپی</button><button class="btn sm" onclick="qr(this.previousElementSibling.dataset.t)">QR</button></div>`;
const cp=b=>{navigator.clipboard.writeText(b.dataset.t).then(()=>toast('کپی شد'))};
function qr(t){const b=$('#qrbox');if(!b)return;if(!window.qrcode){b.innerHTML='';return}try{const q=qrcode(0,'L');q.addData(t);q.make();b.innerHTML='<div class="qr">'+q.createSvgTag({cellSize:4,margin:0})+'</div>'}catch{b.innerHTML='<p class="mu">لینک برای QR خیلی طولانی است</p>'}}

async function inb(){const is=await api('GET','/inbounds');
 $('#main').innerHTML=head('اینباندها','ورودی‌ها خودکار ساخته شده‌اند؛ هر مسیر WebSocket روی دامنه‌ی Railway به هسته‌ی مربوط می‌رسد','<button class="btn pri" onclick="inbForm()">+ اینباند جدید</button>')+
 `<div class="box"><table><tr><th>نام</th><th>پروتکل</th><th>مسیر</th><th>ترافیک</th><th></th></tr>`+is.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${i.protocol.toUpperCase()} · WS · TLS</td>
 <td class="mono">${esc(i.path)}</td><td>${fmt(i.bytes)}</td>
 <td><div class="row"><button class="btn sm pri" onclick="renI('${i.id}')">تغییر نام</button><button class="btn sm" onclick="togI('${i.id}',${!i.enabled})">${i.enabled?'غیرفعال':'فعال'}</button><button class="btn sm dn" onclick="delI('${i.id}')">حذف</button></div></td></tr>`).join('')+'</table></div>'}
function inbForm(){dlg(`<h2>اینباند جدید</h2><label>نام</label><input id="f1" placeholder="مثلاً Xray VLESS 2">
 <div class="two"><div><label>هسته</label><select id="f2"><option value="xray">Xray-core</option><option value="singbox">sing-box</option></select></div>
 <div><label>پروتکل</label><select id="f3"><option>vless</option><option>vmess</option><option>trojan</option></select></div></div>
 <div class="two"><div><label>مسیر (خالی = خودکار)</label><input id="f4" dir="ltr"></div><div><label>پورت داخلی (خالی = خودکار)</label><input id="f5" type="number" dir="ltr"></div></div><p class="derr"></p>
 <div class="foot"><button class="btn" onclick="dlg()">انصراف</button><button class="btn pri" onclick="saveI()">ساخت</button></div>`)}
async function saveI(){await api('POST','/inbounds',{name:$('#f1').value,core:$('#f2').value,protocol:$('#f3').value,path:$('#f4').value,port:$('#f5').value});dlg();toast('ساخته شد');inb().then(stagger)}
async function renI(id){const i=(await api('GET','/inbounds')).find(x=>x.id===id);if(!i)return;
 dlg(`<h2>تغییر نام اینباند</h2><label>نام جدید</label><input id="rn" maxlength="40" value="${esc(i.name)}" onkeydown="if(event.key==='Enter')saveRen('${id}')"><p class="derr"></p>
 <p class="mu">نام در لینک‌های کاربران هم نشان داده می‌شود؛ لینک‌های قبلی بدون تغییر کار می‌کنند.</p>
 <div class="foot"><button class="btn" onclick="dlg()">انصراف</button><button class="btn pri" onclick="saveRen('${id}')">ذخیره</button></div>`);
 setTimeout(()=>{const e=$('#rn');e.focus();e.select()},80)}
async function saveRen(id){const n=$('#rn').value.trim();if(!n){document.querySelectorAll('dialog[open] .derr').forEach(e=>e.textContent='نام نمی‌تواند خالی باشد');return}
 await api('PUT','/inbounds/'+id,{name:n});dlg();toast('نام عوض شد');inb()}
const togI=async(id,e)=>{await api('PUT','/inbounds/'+id,{enabled:e});inb()};
const delI=async id=>{if(confirm('این اینباند حذف شود؟')){await api('DELETE','/inbounds/'+id);inb()}};

async function cores(){const c=await api('GET','/cores');
 $('#main').innerHTML=head('هسته‌ها','وضعیت و گزارش اجرای هر هسته')+Object.entries(c).map(([k,v])=>`<div class="card"><div class="bar" style="margin-bottom:12px"><h3 style="margin:0">${cn(k)}</h3>
 <div class="row">${pill(v.state)}<button class="btn sm" onclick="restart('${k}')">راه‌اندازی مجدد</button></div></div><div class="log">${esc(v.logs.join('\n')||'— بدون گزارش —')}</div></div>`).join('')}
async function restart(k){await api('POST','/cores/'+k+'/restart',{});toast('انجام شد');setTimeout(cores,1200)}

const pwForm=(pre)=>`<label>رمز فعلی</label><input id="pc" type="password" dir="ltr" autocomplete="current-password" ${pre?'value="admin"':''}>
 <label>نام کاربری جدید (اختیاری)</label><input id="p1" dir="ltr" autocomplete="username">
 <div class="two"><div><label>رمز جدید (حداقل ۶ کاراکتر)</label><input id="p2" type="password" dir="ltr" autocomplete="new-password"></div><div><label>تکرار رمز جدید</label><input id="p3" type="password" dir="ltr" autocomplete="new-password"></div></div><p class="derr"></p>`;
 <div class="card"><h3>تغییر رمز و نام کاربری مدیر</h3>${pwForm()}<div class="foot"><button class="btn pri" onclick="savePw()">تغییر رمز</button></div></div>`}
async function saveS(){await api('PUT','/settings',{publicHost:$('#s1').value,connectAddress:$('#s2').value});toast('ذخیره شد')}
async function savePw(){const a=$('#p2').value,err=m=>{toast(m);document.querySelectorAll('dialog[open] .derr').forEach(e=>e.textContent=m)};
 if(a.length<6)return err('رمز جدید باید حداقل ۶ کاراکتر باشد');if(a!==$('#p3').value)return err('تکرار رمز یکسان نیست');
 await api('POST','/password',{current:$('#pc').value,username:$('#p1').value,password:a});toast('رمز تغییر کرد؛ دوباره وارد شوید');setTimeout(()=>location.reload(),1300)}
function showForce(){const d=$('#force');if(d.open)return;
 d.innerHTML=`<h2>رمز عبور را تغییر دهید</h2><p class="sub">با رمز پیش‌فرض وارد شده‌اید. برای امنیت پنل، قبل از ادامه رمز جدید بگذارید.</p>${pwForm(true)}
 <div class="foot"><button class="btn pri" onclick="savePw()">ذخیره و ورود دوباره</button></div>`;
 d.addEventListener('cancel',e=>e.preventDefault());d.showModal()}

function dlg(h){const d=$('#dlg');if(h===undefined){d.close();return}d.innerHTML=h;if(!d.open)d.showModal()}
api('GET','/overview').then(o=>o.mustChange?showForce():go('dash')).catch(()=>{});
</script>
</body>
</html>
